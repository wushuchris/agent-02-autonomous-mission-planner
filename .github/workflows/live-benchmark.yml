name: Live model benchmark

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face Inference Providers model identifier
        required: true
        default: Qwen/Qwen3.8-27B:ovhcloud
      base_url:
        description: OpenAI-compatible Hugging Face router URL
        required: true
        default: https://router.huggingface.co/v1
      scenario_limit:
        description: Number of scenarios to run (1-8; use 8 for the full benchmark)
        required: true
        default: '8'
  push:
    branches:
      - live-model-benchmark

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run controlled live benchmark
        env:
          HF_TOKEN: ${{ secrets.HF_INFERENCE_TOKEN }}
          MODEL_ID: ${{ inputs.model_id || 'Qwen/Qwen3.8-27B:ovhcloud' }}
          HF_BASE_URL: ${{ inputs.base_url || 'https://router.huggingface.co/v1' }}
        run: >-
          python -m scripts.live_benchmark
          --limit ${{ inputs.scenario_limit || '8' }}
          --output benchmark-results/live_results.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-02-live-benchmark-${{ github.run_id }}
          path: benchmark-results/live_results.json
          if-no-files-found: warn
          retention-days: 30
